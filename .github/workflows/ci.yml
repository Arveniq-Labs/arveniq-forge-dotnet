name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-contract-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Arveniq.Forge.sln
      - run: dotnet build Arveniq.Forge.sln --configuration Release --no-restore
      - run: dotnet run --project tests/Arveniq.Forge.ContractTests --configuration Release --no-build
      - run: dotnet run --project tests/Arveniq.Forge.Maui.ContractTests --configuration Release --no-build
